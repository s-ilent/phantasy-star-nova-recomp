# Phantasy Star Nova (PCSG00351, JP; the format: pipeline/packconf.py). Only facts about the game; nothing of its code
# or data. The main program is NovaMRom (eboot.bin, 28 MB as ELF). Its data is CRI CPK archives read through sceIo
# (no SceFios2 import); movies through SceAvPlayer; sound through NGS (ATRAC9 voices) and sceAudioOut.
NAME = "Phantasy Star Nova"
# REGION: the release this pack plays (content id JP0177-PCSG00351_00-NOVAAPPLICATION0, Japan). The player's copy may
# carry a rePatch folder (an English fan translation that replaces NOVA_FileList_Vita_patch.cpk and _movie.cpk): see
# docs/psnova/README.md for how it is layered.
REGION = "JP"
SPLIT = 100               # ~3x Uncharted's main program (28 MB against 9.5 MB as ELF)
# libscemp4 + libsceavplayer: the firmware's MP4 demuxer and movie player behind the game's SceAvPlayer movies (H.264
# decoded by runtime/media/video.c), as for Killzone. The game's sce_module also has libfios2, libult, libface and
# libsmart: the main program imports from none of them (sceKernelLoadStartModule is answered by the runtime), so they
# are not loaded, as with Killzone's identical set.
MODULES = "libc libgxm_es4 libgpu_es4 libscemp4 libsceavplayer"
# Clip near geometry in Nova cutscenes (Kisara bridge and Fildia desert).
RUN_ENV = "RECOMP_SRGB=1 RECOMP_DEFER_DRAWS=1 RECOMP_GPU_DEPTH_CLIP=1"   # play: the GPU renderer, the real clock. RECOMP_SRGB=1: the textures' and surfaces' gamma (sRGB) modes, as Uncharted, Unit 13 and Killzone have them -- without them cutscene characters came out washed out (Lutina's red outfit pink, black suits grey) and the sky's pink glow saturated to magenta, against my real-Vita frames; checked title, creation, movies, arena and the Lutina cutscene (2026-11-19, docs/psnova/cutscene-colours.md). Predicted pipelines are on again (RECOMP_PIPE_PREDICT=0 until 2026-11-19 evening): the 16-18 s black screen at start was usse.c looping over absurd header counts of 9 non-programs in the game's files, not the pipelines; with the counts bounded the pass takes 1.0 s and frame 300 comes at 6.4 s (docs/psnova/external-fix-list-check.md)
TEST_ENV = "RECOMP_GFX=soft RECOMP_CLOCK=fixed RECOMP_SRGB=1"   # the gate's reference: software renderer, fixed clock. Not RECOMP_SKIP_MOVIES: with the movies skipped (AvPlayer answering "no stream") the title never took Start (2026-11-18); the movies decode fine through the firmware's AvPlayer
# REPATCH_KEEP: the English rePatch's NOVA_FileList_Vita_patch.cpk replaces the 1.05 update's whole archive and lacks
# one entry the update added (tex_nova_ui_common.aif, in no other archive): without it the game drew noise on Filldia
# and its NOW LOADING screen. import builds the rePatch archive plus that entry (vitarecomp.py repatch_keep, 2026-11-18).
REPATCH_KEEP = "NOVA_FileList_Vita_patch.cpk:tex_nova_ui_common.aif"
# REPATCH = "off": Japanese game only (my decision 2026-11-18 evening); import skips repatch0 (same as RECOMP_NO_REPATCH=1)
# and REPATCH_KEEP above is moot. Our own files (overlay0\, same layout as app0) are layered instead: vitarecomp.py cmd_import.
REPATCH = "off"
# LOCALIZE: the English localization (english/localize.py), built from your copy after the build: the text, UI art and
# movie subtitles in English, the burned-in Japanese subtitles removed. F10 > Language switches back to the original.
LOCALIZE = "english/localize.py"
TEST_FRAMES = 1200
TEST_TIMEOUT = 600

# 1.05, the update as installed over 1.00 (the official patch folder); 1.00's
# eboot.bin.elf is f4b3a669b53cf5ac8a2ecb26b3686011011129d8db7930c88a578e1463592542 (not played).
[versions."1.05"]
sha256 = "abb45e179726d3021de144a900f912534fa6879061e068228cc0cd55286edcf3"
status = "recommended"
# FUNCTION_SEEDS: functions the analysis misses (2026-11-19 evening, docs/psnova/external-fix-list-check.md). 0x81e53e70: a
# varargs prologue (mov ip, sp; push.w {r0-r3}) after bx lr; its pointer is built in FUN_814ef956 through a register copy
# the movw/movt tracker doesn't follow, and stored in a Function object (the push.w at 0x81e53e76 was found). The ARM five:
# two switch heads (uxth ...; after pop {r4, pc} / bx lr) and three bx ip thunks. Another port of the game (on 1.00) seeds
# the 1.00 counterparts (0x81dd110c, 0x81a028a8...); these are 1.05's, checked against the bytes.
FUNCTION_SEEDS = "0x81e53e70:thumb 0x81a687a0:arm 0x81a688e8:arm 0x81a698a4:arm 0x81a698b4:arm 0x81a698c4:arm 0x8209d688:arm 0x822b0d6c:thumb"  # the last two: carried over from the development analysis (release 0.1.0 Beta 1)
HOOKS = "0x81b1c958:psn_pad_update 0x81b2a8bc:psn_tree_insert 0x81a7756c:psn_frame_rate 0x817e850e:psn_rtl_mark 0x817e882e:psn_rtl_mark"   # psn_rtl_mark: Arabic right alignment (with IHOOKS psn_rtl_align; hooks.c, docs/psnova/right-alignment-research.md). diagnostics (hooks.c): the pad device's update (RECOMP_PSN_INPUT_TRACE=1); the map insert that aborts after Start the Game. psn_frame_rate: 60 fps with the frame_rate setting (hooks.c, docs/psnova/60fps-sites.md)
IHOOKS = "0x81a1f284:psn_input_slot 0x81905b10:psn_rtl_align"   # psn_rtl_align: a box whose message starts with 0x8095 (Arabic) aligns right. diagnostics: each device slot the input thread's loop loads
# GAME_ADDRS: the game's own data the host hooks above use -- the vsync object pointer the frame limiter reads and the
# cloth/physics step psn_frame_rate writes (hooks.c). Data, so packconf shifts them by ADDR_DATA_DELTA, not by the code's.
GAME_ADDRS = "psn_vsync_object=0x82474314 psn_frame_step=0x82474334"

# 1.05 as the dumps a game dumper re-links carry it: the same program, with every segment and every address inside it
# 0x1700000 higher. (The dumper's eboot.bin starts "SCE\0" and is exactly 0x1000 bytes longer than the ELF inside it -- a
# wrapper around a plain ELF -- and the same dump's sce_module also holds libc_m/libfios2_m; the Japanese cartridge and
# update VPKs have it. An original NoNpDrm/PKG copy is [versions."1.05"] above.)
# The addresses below are that table's, unchanged: MAIN_BASE is the whole difference, and packconf shifts them by it, so
# nothing here is hand-computed. The program is the same code, re-linked: 11 of the 11 addresses above (the six
# FUNCTION_SEEDS "checked against the bytes", the five HOOKS, the two IHOOKS) decode to exactly the bytes the pack
# describes at +0x1700000, and the text segment is 0x146BF90 bytes -- 0x8246bf90 - 0x81000000, the range
# dev/psnova/even_pointers.py scans -- at 0x82700000..0x83B6BF90 here.
[versions."1.05-maidump"]
sha256 = "74e66d0bafc561f4ba4a763d9539e49833fe5b683c50e60af55745c7a5316f1c"
status = "supported"
MAIN_BASE = "0x82700000"
# This build's data moved further than its code: the re-link put the data segment 0x1714000 up, not 0x1700000, because
# it follows code of its own length and its own alignment. Measured from the build itself: the cloth/physics step the
# pack's hook writes is at 0x83b88334 here and at 0x82474334 in the reference, and that value (1/31 = 0x3d042108) is
# the only 1/31 in the image's data. With one delta for both, psn_frame_rate read a zeroed gap address, so enabling
# 60 fps did nothing and the game kept its own 30 (2026-11-27).
ADDR_DATA_DELTA = "0x1714000"
FUNCTION_SEEDS = "0x81e53e70:thumb 0x81a687a0:arm 0x81a688e8:arm 0x81a698a4:arm 0x81a698b4:arm 0x81a698c4:arm 0x8209d688:arm 0x822b0d6c:thumb"
HOOKS = "0x81b1c958:psn_pad_update 0x81b2a8bc:psn_tree_insert 0x81a7756c:psn_frame_rate 0x817e850e:psn_rtl_mark 0x817e882e:psn_rtl_mark"
IHOOKS = "0x81a1f284:psn_input_slot 0x81905b10:psn_rtl_align"
GAME_ADDRS = "psn_vsync_object=0x82474314 psn_frame_step=0x82474334"
